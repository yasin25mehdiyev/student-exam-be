name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish src/StudentExam.Api -c Release -o ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip . && cd ..

      # SCM Basic Auth (publish-profile/Kudu) is disabled by default on new App
      # Service instances, so azure/webapps-deploy's publish-profile path always
      # fails here. `az webapp deploy` uses the OIDC login above (ARM-based) instead.
      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group student-exam-rg \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --src-path publish.zip \
            --type zip
